<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swift Safe Energy - Global Business Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0A0E17 0%, #0F1624 50%, #0A0E17 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      z-index: 10;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }

    .map-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 2 / 1;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(37, 99, 235, 0.15),
        0 0 120px rgba(37, 99, 235, 0.05),
        inset 0 0 60px rgba(0, 0, 0, 0.3);
    }

    #worldMap {
      width: 100%;
      height: 100%;
      display: block;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      z-index: 20;
    }

    .legend-title {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.hq {
      background: #06B6D4;
      box-shadow: 0 0 10px #06B6D4;
    }

    .legend-dot.business {
      background: #2563EB;
      box-shadow: 0 0 8px #2563EB;
    }

    .legend-dot.manufacturing {
      background: #3B82F6;
      box-shadow: 0 0 8px #3B82F6;
    }

    .legend-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
    }

    .legend-role {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }

    .info-card {
      position: absolute;
      background: rgba(10, 14, 23, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(37, 99, 235, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 200px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 30;
    }

    .info-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .info-card .role {
      font-size: 11px;
      color: #06B6D4;
      margin-bottom: 8px;
    }

    .info-card .desc {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 20px;
      }

      .legend {
        bottom: 10px;
        right: 10px;
        padding: 12px 16px;
      }

      .legend-item {
        margin-bottom: 6px;
      }
    }
  </style>
</head>
<body>

  </div>

    // ============================================

    // Node data with real coordinates

    // Regional targets for phase 3
    const REGIONAL_TARGETS = [

    // Simplified continent paths (Equirectangular projection)
    const CONTINENTS = [
      // North America

      // USA

      { path: 'M 281,178 L 305,172 L 325,182 L 332,198 L 322,215 L 302,224 L 281,220 L 272,205 L 275,190 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 295,185 L 330,178 L 365,188 L 392,205 L 410,230 L 415,262 L 405,295 L 385,325 L 358,348 L 328,362 L 298,368 L 270,360 L 250,342 L 242,312 L 250,280 L 268,250 L 285,218 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 268,225 L 292,218 L 312,228 L 320,248 L 312,272 L 295,292 L 275,305 L 258,302 L 250,280 L 255,252 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 268,310 L 295,302 L 325,312 L 348,332 L 360,360 L 362,392 L 355,425 L 340,455 L 318,472 L 292,480 L 265,478 L 242,462 L 228,435 L 225,400 L 235,365 L 252,335 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Europe
      { path: 'M 467,88 L 480,82 L 490,88 L 492,100 L 485,112 L 475,118 L 465,115 L 460,102 Z M 468,120 L 478,116 L 485,122 L 482,132 L 472,136 L 465,130 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 468,115 L 492,108 L 518,115 L 532,128 L 528,145 L 512,158 L 492,162 L 472,158 L 460,142 L 462,128 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 450,128 L 478,122 L 498,132 L 505,150 L 495,168 L 475,175 L 452,172 L 442,155 L 445,140 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 502,95 L 525,90 L 545,98 L 552,112 L 545,128 L 525,135 L 505,130 L 495,115 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 498,128 L 518,122 L 535,130 L 542,145 L 535,162 L 518,175 L 498,172 L 490,155 L 490,140 Z M 508,180 L 520,175 L 530,185 L 525,198 L 512,202 L 502,195 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Africa
      { path: 'M 418,155 L 448,148 L 478,158 L 488,172 L 478,188 L 452,195 L 425,192 L 412,178 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 452,155 L 492,148 L 528,160 L 545,180 L 538,205 L 512,220 L 478,225 L 450,218 L 435,198 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 502,155 L 542,148 L 578,162 L 592,185 L 585,212 L 558,228 L 525,232 L 498,222 L 485,202 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 578,168 L 605,162 L 628,172 L 638,192 L 628,215 L 605,225 L 580,220 L 568,200 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 518,255 L 558,248 L 595,262 L 612,285 L 605,312 L 578,328 L 542,332 L 512,322 L 498,298 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 528,355 L 562,348 L 598,362 L 618,388 L 612,418 L 585,440 L 552,448 L 522,438 L 508,412 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Russia
      { path: 'M 578,42 L 618,35 L 665,38 L 715,45 L 762,55 L 805,68 L 840,85 L 862,105 L 868,130 L 855,155 L 828,172 L 795,180 L 758,178 L 720,168 L 685,152 L 655,132 L 628,108 L 608,78 L 592,52 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // China (highlighted)
      { path: 'M 708,118 L 752,108 L 802,118 L 848,135 L 885,158 L 905,185 L 908,218 L 895,252 L 868,280 L 835,300 L 795,312 L 755,318 L 718,312 L 685,295 L 660,268 L 648,235 L 655,198 L 678,165 L 700,138 Z', fill: CONFIG.colors.chinaFill, stroke: CONFIG.colors.chinaStroke, isChina: true },
      // India
      { path: 'M 665,178 L 705,168 L 748,180 L 782,202 L 798,232 L 792,268 L 768,302 L 735,325 L 698,335 L 665,325 L 642,298 L 632,262 L 642,222 L 655,195 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Japan
      { path: 'M 872,122 L 888,115 L 902,128 L 908,148 L 898,168 L 882,182 L 865,188 L 852,178 L 852,155 L 862,138 Z M 878,195 L 892,190 L 902,202 L 898,218 L 885,228 L 870,225 L 862,212 L 868,198 Z M 872,235 L 885,230 L 895,242 L 890,258 L 875,268 L 858,265 L 850,250 L 858,238 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Southeast Asia
      { path: 'M 762,208 L 782,198 L 798,212 L 805,238 L 795,265 L 775,285 L 758,290 L 748,272 L 752,245 L 758,222 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 775,222 L 792,215 L 808,228 L 815,252 L 808,280 L 792,305 L 775,318 L 762,312 L 758,285 L 768,255 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Indonesia & Australia
      { path: 'M 768,305 L 805,295 L 842,305 L 875,322 L 895,345 L 885,375 L 858,398 L 825,408 L 792,405 L 762,392 L 745,365 L 752,335 Z M 775,415 L 802,408 L 828,418 L 838,438 L 822,455 L 798,462 L 775,455 L 768,435 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      { path: 'M 798,278 L 838,268 L 882,282 L 922,305 L 945,338 L 938,378 L 912,415 L 875,442 L 835,458 L 795,455 L 762,432 L 748,395 L 758,348 L 778,305 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
      // Greenland
      { path: 'M 295,52 L 328,42 L 368,48 L 402,62 L 425,82 L 428,108 L 408,132 L 375,148 L 338,152 L 305,142 L 285,118 L 282,88 Z', fill: CONFIG.colors.country, stroke: CONFIG.colors.countryStroke },
    ];

    // ============================================
    // Canvas & Animation State
    // ============================================
    const canvas = document.getElementById('worldMap');
    const ctx = canvas.getContext('2d');
    const infoCard = document.getElementById('infoCard');

    let width, height;
    let startTime = Date.now();
    let animationFrame;
    let nodePositions = [];
    let regionalPositions = [];
    let flyingLines = [];
    let particles = [];

    // ============================================
    // Utility Functions
    // ============================================
    function resize() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      width = rect.width;
      height = rect.height;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.scale(dpr, dpr);

      // Recalculate positions
      calculatePositions();
    }

    function geoToPixel(lat, lng) {
      const x = ((lng + 180) / 360) * width;
      const y = ((90 - lat) / 180) * height;
      return { x, y };
    }

    function calculatePositions() {
      nodePositions = NODES.map(node => {
        const pos = geoToPixel(node.lat, node.lng);
        return { ...node, x: pos.x, y: pos.y };
      });

      regionalPositions = REGIONAL_TARGETS.map(target => {
        const pos = geoToPixel(target.lat, target.lng);
        return { ...target, x: pos.x, y: pos.y };
      });
    }

    function getCurrentPhase(elapsed) {
      if (elapsed < CONFIG.animation.phase1End) return 1;
      if (elapsed < CONFIG.animation.phase2End) return 2;
      return 3;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // ============================================
    // Drawing Functions
    // ============================================
    function drawGrid() {
      ctx.strokeStyle = CONFIG.colors.grid;
      ctx.lineWidth = 0.5;

      // Latitude lines
      for (let lat = -60; lat <= 60; lat += 30) {
        const y = ((90 - lat) / 180) * height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Longitude lines
      for (let lng = -180; lng <= 180; lng += 30) {
        const x = ((lng + 180) / 360) * width;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // Highlight equator
      ctx.strokeStyle = CONFIG.colors.gridHighlight;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
    }

    function drawContinentPath(continent) {
      const path = new Path2D(continent.path);
      ctx.fillStyle = continent.fill;
      ctx.strokeStyle = continent.stroke;
      ctx.lineWidth = continent.isChina ? 1.5 : 0.8;
      ctx.fill(path);
      ctx.stroke(path);
    }

    function drawContinentPaths() {
      CONTINENTS.forEach(drawContinentPath);
    }

    function drawBezierCurve(from, to, curvature = 0.2) {
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      const offset = Math.min(Math.abs(to.x - from.x), Math.abs(to.y - from.y)) * curvature;

      const cpX = midX;
      const cpY = midY - offset;

      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.quadraticCurveTo(cpX, cpY, to.x, to.y);
    }

    function drawFlyingLine(from, to, progress, color, glowColor, lineWidth = 2) {
      // Calculate bezier curve points
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      const offset = Math.min(Math.abs(to.x - from.x), Math.abs(to.y - from.y)) * 0.3;
      const cpX = midX;
      const cpY = midY - offset;

      // Calculate point along curve at progress
      const t = progress;
      const x = Math.pow(1-t, 2) * from.x + 2 * (1-t) * t * cpX + Math.pow(t, 2) * to.x;
      const y = Math.pow(1-t, 2) * from.y + 2 * (1-t) * t * cpY + Math.pow(t, 2) * to.y;

      // Draw base line (dim)
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.globalAlpha = 0.3;
      drawBezierCurve(from, to);
      ctx.stroke();

      // Draw animated portion
      const animatedPoints = [];
      for (let i = 0; i <= progress * 100; i++) {
        const pt = i / 100;
        const px = Math.pow(1-pt, 2) * from.x + 2 * (1-pt) * pt * cpX + Math.pow(pt, 2) * to.x;
        const py = Math.pow(1-pt, 2) * from.y + 2 * (1-pt) * pt * cpY + Math.pow(pt, 2) * to.y;
        animatedPoints.push({ x: px, y: py });
      }

      if (animatedPoints.length > 1) {
        // Glow
        ctx.strokeStyle = glowColor;
        ctx.lineWidth = lineWidth + 4;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.moveTo(animatedPoints[0].x, animatedPoints[0].y);
        animatedPoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();

        // Core line
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.moveTo(animatedPoints[0].x, animatedPoints[0].y);
        animatedPoints.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();

        // Particle at tip
        const tip = animatedPoints[animatedPoints.length - 1];
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    function drawNode(node, elapsed, phase) {
      const { x, y, color, glowColor, name, nameEn, role, roleEn, type } = node;

      // Calculate pulse animation
      const pulsePhase = (elapsed % CONFIG.animation.pulseSpeed) / CONFIG.animation.pulseSpeed;
      const pulseScale = 1 + Math.sin(pulsePhase * Math.PI * 2) * 0.3;
      const pulseOpacity = 0.4 + Math.sin(pulsePhase * Math.PI * 2) * 0.3;

      // Opacity based on phase
      let opacity = 0;
      if (phase >= 1) {
        const phase1Progress = phase === 1 ? 1 : Math.min(1, (elapsed - CONFIG.animation.phase1End) / 500 + 1);
        opacity = easeOutCubic(phase1Progress);
      }

      ctx.globalAlpha = opacity;

      // Outer glow
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, 40 * pulseScale);
      gradient.addColorStop(0, glowColor);
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, 40 * pulseScale, 0, Math.PI * 2);
      ctx.fill();

      // Pulse ring
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = opacity * pulseOpacity;
      ctx.beginPath();
      ctx.arc(x, y, 25 * pulseScale, 0, Math.PI * 2);
      ctx.stroke();

      // Core
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, type === 'hq' ? 8 : 6, 0, Math.PI * 2);
      ctx.fill();

      // Inner highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(x - 2, y - 2, type === 'hq' ? 3 : 2, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.font = `600 ${type === 'hq' ? 13 : 11}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillStyle = CONFIG.colors.text;
      ctx.textAlign = 'center';
      ctx.fillText(name, x, y - 18);

      ctx.font = `400 10px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillStyle = CONFIG.colors.textMuted;
      ctx.fillText(role, x, y - 6);

      ctx.globalAlpha = 1;
    }

    function drawRegionalDots(elapsed, phase) {
      if (phase < 3) return;

      const phase3Elapsed = elapsed - CONFIG.animation.phase2End;
      const progress = Math.min(1, phase3Elapsed / 1500);

      regionalPositions.forEach(target => {
        const pulsePhase = (elapsed % 3000) / 3000;
        const pulseScale = 1 + Math.sin(pulsePhase * Math.PI * 2) * 0.5;
        const opacity = progress * 0.6;

        ctx.globalAlpha = opacity;

        // Glow
        const gradient = ctx.createRadialGradient(target.x, target.y, 0, target.x, target.y, 15 * pulseScale);
        gradient.addColorStop(0, 'rgba(37, 99, 235, 0.8)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(target.x, target.y, 15 * pulseScale, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.fillStyle = '#2563EB';
        ctx.beginPath();
        ctx.arc(target.x, target.y, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
      });
    }

    // ============================================
    // Animation Loop
    // ============================================
    function animate() {
      const elapsed = Date.now() - startTime;
      const phase = getCurrentPhase(elapsed);

      // Clear canvas
      ctx.clearRect(0, 0, width, height);

      // Draw layers
      drawGrid();
      drawContinentPaths();
      drawRegionalDots(elapsed, phase);

      // Phase 2: HQ connections
      if (phase >= 2) {
        const phase2Elapsed = elapsed - CONFIG.animation.phase1End;
        const shenzhen = nodePositions.find(n => n.id === 'shenzhen');

        const connections = [
          { to: nodePositions.find(n => n.id === 'shanghai'), delay: 0 },
          { to: nodePositions.find(n => n.id === 'guangzhou'), delay: 300 },
          { to: nodePositions.find(n => n.id === 'shaoxing'), delay: 600 },
        ];

        connections.forEach(conn => {
          const connElapsed = phase2Elapsed - conn.delay;
          if (connElapsed > 0) {
            const progress = Math.min(1, connElapsed / 800);
            drawFlyingLine(shenzhen, conn.to, easeOutCubic(progress), CONFIG.colors.hq, CONFIG.colors.hqGlow, 2);
          }
        });
      }

      // Phase 3: Secondary connections
      if (phase >= 3) {
        const phase3Elapsed = elapsed - CONFIG.animation.phase2End;

        const sources = nodePositions.filter(n => n.id !== 'shenzhen');

        sources.forEach((source, sIdx) => {
          // Select targets for this source
          const targets = regionalPositions.slice(sIdx * 2, sIdx * 2 + 2);

          targets.forEach((target, tIdx) => {
            const lineElapsed = phase3Elapsed - (tIdx * 400);
            const cycleTime = 3000;
            const cyclePos = (lineElapsed % cycleTime) / cycleTime;

            // Draw connecting line
            const progress = Math.min(1, lineElapsed / 1000);
            const loopedProgress = cycleTime > 1500 ? (lineElapsed % cycleTime) / 2000 : progress;

            if (progress > 0) {
              drawFlyingLine(source, target, loopedProgress, CONFIG.colors.secondaryLine, 'rgba(37, 99, 235, 0.5)', 1);
            }
          });
        });
      }

      // Draw nodes
      nodePositions.forEach(node => {
        drawNode(node, elapsed, phase);
      });

      animationFrame = requestAnimationFrame(animate);
    }

    // ============================================
    // Interaction
    // ============================================
    function handleMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      let hoveredNode = null;

      nodePositions.forEach(node => {
        const dist = Math.sqrt(Math.pow(x - node.x, 2) + Math.pow(y - node.y, 2));
        if (dist < 30) {
          hoveredNode = node;
        }
      });

      if (hoveredNode) {
        infoCard.querySelector('#infoName').textContent = hoveredNode.name;
        infoCard.querySelector('#infoRole').textContent = `${hoveredNode.role} ${hoveredNode.roleEn}`;
        infoCard.querySelector('#infoDesc').textContent = hoveredNode.desc;
        infoCard.classList.add('visible');

        const cardX = Math.min(x + 20, width - 220);
        const cardY = Math.min(y - 80, height - 100);
        infoCard.style.left = cardX + 'px';
        infoCard.style.top = cardY + 'px';
        canvas.style.cursor = 'pointer';
      } else {
        infoCard.classList.remove('visible');
        canvas.style.cursor = 'default';
      }
    }

    // ============================================
    // Initialize
    // ============================================
    function init() {
      resize();
      window.addEventListener('resize', resize);
      canvas.addEventListener('mousemove', handleMouseMove);
      animate();
    }

    init();
  </script>
</body>
</html>
