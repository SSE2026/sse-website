<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深安锂能 - 36000mAh 固态软包电池 3D 爆炸图展示组件</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 3D 渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls 视角控制器 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP 补间动画引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
        }

        /* 玻璃拟态控制面板 */
        .glass-panel {
            background: rgba(8, 16, 35, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.22);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
        }

        .glow-text {
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        /* 3D 标签引导线条 */
        .annotation-label {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }

        .annotation-label.visible {
            opacity: 1;
        }

        /* 自定义 Slider 样式 */
        input[type=range] {
            accent-color: #00f0ff;
        }
    </style>
</head>
<body class="relative w-full h-full select-none">

    <!-- 顶部产品信息 HUD -->
    <div class="absolute top-5 left-5 z-20 max-w-sm w-full space-y-3">
        <div class="glass-panel rounded-2xl p-5">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span class="text-xs font-mono tracking-widest text-cyan-400 uppercase">SWIFT SAFE ENERGY</span>
                </div>
                <span id="statusBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/30 font-mono">
                    完整形态
                </span>
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide glow-text">深安锂能 36000mAh</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono">HIGH DENSITY SOLID-STATE UAV BATTERY MODULE</p>

            <!-- 核心规格参数网格 -->
            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800 text-center font-mono">
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400">能量密度</div>
                    <div class="text-xs font-bold text-cyan-300 mt-0.5">360 Wh/kg</div>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400">组合结构</div>
                    <div class="text-xs font-bold text-amber-300 mt-0.5">12S1P</div>
                </div>
                <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                    <div class="text-[10px] text-slate-400">标称电压</div>
                    <div class="text-xs font-bold text-emerald-300 mt-0.5">42V / 5C</div>
                </div>
            </div>
        </div>

        <!-- 交互控制器面板 -->
        <div class="glass-panel rounded-xl p-3 flex flex-col gap-2.5 text-xs">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <button id="btnPlayPause" class="p-2 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 border border-cyan-400/30 transition">
                        <i class="fa-solid fa-pause w-3 h-3 flex items-center justify-center" id="iconPlay"></i>
                    </button>
                    <button id="btnReset" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                        <i class="fa-solid fa-rotate-right w-3 h-3 flex items-center justify-center"></i>
                    </button>
                    <span class="text-slate-400 text-[11px] font-mono ml-1">爆炸解构动画循环</span>
                </div>
                <button id="btnToggleAngle" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 text-[11px]">
                    <i class="fa-solid fa-camera mr-1"></i>重置视角
                </button>
            </div>

            <!-- 手动手动拆解进度条 -->
            <div class="flex items-center gap-3 pt-1">
                <span class="text-[11px] text-slate-400 font-mono">合拢</span>
                <input type="range" id="explodeSlider" min="0" max="1" step="0.001" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                <span class="text-[11px] text-amber-400 font-mono">拆解</span>
            </div>
        </div>
    </div>

    <!-- 右侧图层结构指引说明卡 -->
    <div class="absolute top-5 right-5 z-20 glass-panel rounded-2xl p-4 text-xs space-y-3 max-w-[220px]">
        <div class="font-bold text-slate-200 border-b border-slate-800 pb-2 flex items-center gap-2">
            <i class="fa-solid fa-cubes-stacked text-cyan-400"></i>
            解构层级与部件明细
        </div>
        <div class="space-y-2 text-[11px]" id="layerList">
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-slate-400"></span> 01. 镀镍/铝极耳 (Tabs)</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-slate-300"></span> 02. 铝塑膜冲深外壳 (Top)</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-cyan-400"></span> 03. 正极集流体/极片 (Cathode)</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-amber-400"></span> 04. 固态电解质层 (Solid Electrolyte)</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-orange-500"></span> 05. 负极集流体/极片 (Anode)</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> 06. 12S 叠片电芯芯体</div>
            <div class="flex items-center gap-2 text-slate-300"><span class="w-2 h-2 rounded-full bg-slate-500"></span> 07. 铝塑膜封装底壳 (Bottom)</div>
        </div>
    </div>

    <!-- 3D 动态悬浮标注 overlay -->
    <div id="labelsContainer" class="absolute inset-0 z-10 pointer-events-none"></div>

    <!-- Three.js 渲染 Canvas 容器 -->
    <div id="canvasContainer" class="w-full h-full relative z-0"></div>

    <script>
        // --- 1. Three.js 场景初始化 ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050a14, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.8, 2.2, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.minDistance = 2;
        controls.maxDistance = 8;

        // --- 2. 高科技舞台灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 1.5);
        dirLight1.position.set(5, 8, 5);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffaa00, 1.0);
        dirLight2.position.set(-5, -2, -4);
        scene.add(dirLight2);

        const pointLight = new THREE.PointLight(0xffffff, 0.8, 10);
        pointLight.position.set(0, 2, 0);
        scene.add(pointLight);

        // 底部渐变科技虚线圆盘底座
        const gridHelper = new THREE.GridHelper(10, 20, 0x00f0ff, 0x1e293b);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        // --- 3. 创建软包固态锂电池 3D 模型组件 ---
        const batteryGroup = new THREE.Group();
        batteryGroup.rotation.x = 0.2;
        batteryGroup.rotation.y = -0.4;
        scene.add(batteryGroup);

        const layers = [];
        let explodeFactor = 0;

        // 材质库
        const silverPouchMat = new THREE.MeshStandardMaterial({
            color: 0xe2e8f0,
            metalness: 0.85,
            roughness: 0.25,
            clearcoat: 0.3
        });

        const labelTextureMat = createLabelTextureMaterial();

        const cathodeMat = new THREE.MeshStandardMaterial({
            color: 0x00d8ff,
            metalness: 0.9,
            roughness: 0.2,
            emissive: 0x003344
        });

        const electrolyteMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            metalness: 0.1,
            roughness: 0.4,
            transparent: true,
            opacity: 0.85
        });

        const anodeMat = new THREE.MeshStandardMaterial({
            color: 0xb45309,
            metalness: 0.95,
            roughness: 0.15
        });

        const cellStackMat = new THREE.MeshStandardMaterial({
            color: 0x10b981,
            metalness: 0.3,
            roughness: 0.5
        });

        const tabMat = new THREE.MeshStandardMaterial({
            color: 0xcbd5e1,
            metalness: 0.9,
            roughness: 0.1
        });

        // 尺寸参数
        const width = 1.6;
        const length = 2.4;
        const thickness = 0.04;

        // 图层结构定义 (从上到下)
        const layerDefs = [
            { name: "极耳 (Tabs)", type: "tabs", targetY: 0.9, label: "Nickel / Aluminum Tabs" },
            { name: "铝塑膜封包 (顶壳)", mat: [silverPouchMat, labelTextureMat], thickness: 0.03, targetY: 0.65, label: "Aluminum Pouch Top Film" },
            { name: "正极集流体 (铝箔)", mat: cathodeMat, thickness: 0.02, targetY: 0.38, label: "Cathode Collector (Al Foil)" },
            { name: "固态电解质层", mat: electrolyteMat, thickness: 0.025, targetY: 0.12, label: "Solid-State Electrolyte Layer" },
            { name: "负极集流体 (铜箔)", mat: anodeMat, thickness: 0.02, targetY: -0.12, label: "Anode Collector (Cu Foil)" },
            { name: "12S 叠片电芯芯体", mat: cellStackMat, thickness: 0.08, targetY: -0.38, label: "12S Solid-State Stacking Cells" },
            { name: "铝塑膜封装 (底壳)", mat: silverPouchMat, thickness: 0.03, targetY: -0.65, label: "Aluminum Pouch Bottom Film" }
        ];

        // 构建各层 Mesh
        layerDefs.forEach((def, index) => {
            const layerGroup = new THREE.Group();

            if (def.type === "tabs") {
                const tabGeo = new THREE.BoxGeometry(0.28, 0.35, 0.015);
                const posTab = new THREE.Mesh(tabGeo, tabMat);
                posTab.position.set(-0.4, length / 2 + 0.12, 0);

                const negTab = new THREE.Mesh(tabGeo, tabMat);
                negTab.position.set(0.4, length / 2 + 0.12, 0);

                layerGroup.add(posTab);
                layerGroup.add(negTab);
            } else {
                let mesh;
                const geo = new THREE.BoxGeometry(width, length, def.thickness);

                if (Array.isArray(def.mat)) {
                    const materials = [
                        silverPouchMat, silverPouchMat, silverPouchMat, silverPouchMat,
                        def.mat[1],
                        silverPouchMat
                    ];
                    mesh = new THREE.Mesh(geo, materials);
                } else {
                    mesh = new THREE.Mesh(geo, def.mat);
                }

                mesh.castShadow = true;
                mesh.receiveShadow = true;
                layerGroup.add(mesh);
            }

            layerGroup.userData = {
                baseY: (3 - index) * 0.035,
                targetY: def.targetY,
                name: def.name,
                label: def.label
            };

            layerGroup.position.y = layerGroup.userData.baseY;
            batteryGroup.add(layerGroup);
            layers.push(layerGroup);
        });

        // 动态绘制 Canvas 电池品牌标签贴图
        function createLabelTextureMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 768;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#d1d5db';
            ctx.fillRect(0, 0, 512, 768);

            ctx.fillStyle = '#ffffff';
            ctx.roundRect(40, 60, 432, 648, 16);
            ctx.fill();

            ctx.fillStyle = '#0284c7';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('深安锂能', 256, 140);

            ctx.fillStyle = '#64748b';
            ctx.font = '14px sans-serif';
            ctx.fillText('— SWIFT SAFE ENERGY —', 256, 170);

            ctx.fillStyle = '#0f172a';
            ctx.font = '900 52px sans-serif';
            ctx.fillText('36000 mAh', 256, 260);

            ctx.fillStyle = '#0369a1';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('SOLID-STATE TECH', 256, 305);

            ctx.fillStyle = '#1d4ed8';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('360 Wh/kg', 256, 370);

            ctx.fillStyle = '#475569';
            ctx.font = '13px sans-serif';
            ctx.fillText('HIGH DENSITY SOLID-STATE UAV BATTERY MODULE', 256, 405);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(70, 430); ctx.lineTo(442, 430); ctx.stroke();

            ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#0f172a';
            ctx.fillText('5C', 120, 480);
            ctx.fillText('12S1P', 256, 480);
            ctx.fillText('42V', 390, 480);

            ctx.font = '12px sans-serif'; ctx.fillStyle = '#64748b';
            ctx.fillText('DISCHARGE RATE', 120, 505);
            ctx.fillText('CONFIGURATION', 256, 505);
            ctx.fillText('NOMINAL VOLTAGE', 390, 505);

            ctx.font = '14px sans-serif'; ctx.fillStyle = '#94a3b8';
            ctx.fillText('CE   MADE IN CHINA', 256, 620);

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            return new THREE.MeshStandardMaterial({
                map: texture,
                metalness: 0.1,
                roughness: 0.3
            });
        }

        // --- 4. 创建 3D HTML 浮动指示标签 ---
        const labelsContainer = document.getElementById('labelsContainer');
        const labelElements = [];

        layerDefs.forEach((def, index) => {
            const div = document.createElement('div');
            div.className = 'annotation-label';
            div.innerHTML = `
                <div class="flex items-center gap-2 glass-panel px-3 py-1.5 rounded-lg border border-cyan-400/40 text-[11px]">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
                    <span class="font-bold text-white">${def.name}</span>
                    <span class="text-slate-400 font-mono text-[10px]">(${def.label})</span>
                </div>
            `;
            labelsContainer.appendChild(div);
            labelElements.push(div);
        });

        // 实时更新 3D 悬浮标签屏幕坐标
        function updateLabels() {
            if (explodeFactor < 0.25) {
                labelElements.forEach(el => el.classList.remove('visible'));
                return;
            }

            layers.forEach((layer, index) => {
                const worldPos = new THREE.Vector3();
                layer.getWorldPosition(worldPos);

                worldPos.x += 1.1;

                const screenPos = worldPos.clone().project(camera);
                const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

                const el = labelElements[index];
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                if (screenPos.z < 1) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });
        }

        // --- 5. 爆炸解构与重组 GSAP 补间动画主控 ---
        let mainTimeline = null;
        let isPlaying = true;

        function applyExplodeFactor(progress) {
            explodeFactor = progress;
            document.getElementById('explodeSlider').value = progress;

            layers.forEach((layer) => {
                const currentY = THREE.MathUtils.lerp(layer.userData.baseY, layer.userData.targetY, progress);
                layer.position.y = currentY;
            });

            const statusBadge = document.getElementById('statusBadge');
            if (progress < 0.1) {
                statusBadge.textContent = "完整形态";
                statusBadge.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/30 font-mono";
            } else if (progress > 0.85) {
                statusBadge.textContent = "爆炸解构状态";
                statusBadge.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-amber-950 text-amber-300 border border-amber-500/30 font-mono";
            } else {
                statusBadge.textContent = "动态拆解中...";
                statusBadge.className = "text-[11px] px-2.5 py-0.5 rounded-full bg-blue-950 text-blue-300 border border-blue-500/30 font-mono";
            }
        }

        function buildAnimationTimeline() {
            if (mainTimeline) mainTimeline.kill();

            mainTimeline = gsap.timeline({ repeat: -1, repeatDelay: 1 });

            mainTimeline.to({}, { duration: 2 });

            mainTimeline.to({ p: 0 }, {
                p: 1,
                duration: 2.2,
                ease: "power2.inOut",
                onUpdate: function() {
                    applyExplodeFactor(this.targets()[0].p);
                }
            });

            mainTimeline.to({}, { duration: 3 });

            mainTimeline.to({ p: 1 }, {
                p: 0,
                duration: 2.0,
                ease: "power2.inOut",
                onUpdate: function() {
                    applyExplodeFactor(this.targets()[0].p);
                }
            });
        }

        buildAnimationTimeline();

        // --- 6. 事件监听与 UI 交互绑定 ---
        const explodeSlider = document.getElementById('explodeSlider');
        explodeSlider.addEventListener('input', (e) => {
            if (isPlaying) {
                mainTimeline.pause();
                isPlaying = false;
                document.getElementById('iconPlay').className = "fa-solid fa-play w-3 h-3 flex items-center justify-center";
            }
            applyExplodeFactor(parseFloat(e.target.value));
        });

        document.getElementById('btnPlayPause').addEventListener('click', () => {
            const icon = document.getElementById('iconPlay');
            if (isPlaying) {
                mainTimeline.pause();
                isPlaying = false;
                icon.className = "fa-solid fa-play w-3 h-3 flex items-center justify-center";
            } else {
                if (explodeFactor >= 1) {
                    buildAnimationTimeline();
                } else {
                    mainTimeline.play();
                }
                isPlaying = true;
                icon.className = "fa-solid fa-pause w-3 h-3 flex items-center justify-center";
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            applyExplodeFactor(0);
            buildAnimationTimeline();
            isPlaying = true;
            document.getElementById('iconPlay').className = "fa-solid fa-pause w-3 h-3 flex items-center justify-center";
        });

        document.getElementById('btnToggleAngle').addEventListener('click', () => {
            gsap.to(camera.position, { x: 2.8, y: 2.2, z: 4.2, duration: 1.2, ease: "power2.out" });
            gsap.to(batteryGroup.rotation, { x: 0.2, y: -0.4, z: 0, duration: 1.2, ease: "power2.out" });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. 主渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);

            if (explodeFactor < 0.1) {
                batteryGroup.rotation.y += 0.003;
            }

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
